<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}My Awesome Blog{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">Home</a>
  <a href="{{ url_for('create_post') }}">Create Post</a>
  <form action="{{ url_for('search') }}" method="GET" style="display:inline-block;">
    <input type="text" name="query" placeholder="Search posts..." required>
    <button type="submit">Search</button>
  </form>
</nav>


  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
