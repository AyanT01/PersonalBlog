{% extends "base.html" %}
{% block title %}Edit {{ post.title }}{% endblock %}

{% block content %}
<h1>Edit Post</h1>
<form method="POST" action="{{ url_for('edit_post', post_id=post.id) }}">
  <label for="title">Title:</label><br>
  <input type="text" name="title" id="title" value="{{ post.title }}" required><br><br>

  <label for="content">Content:</label><br>
  <textarea name="content" id="content" rows="8" required>{{ post.content }}</textarea><br><br>

  <input type="submit" value="Update">
</form>
{% endblock %}
