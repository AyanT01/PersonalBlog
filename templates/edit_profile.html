{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="edit-profile-container">
  <h1>Edit Your Profile</h1>

  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" value="{{ user.name }}" required>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" value="{{ user.email }}" required>
    </div>

    <div class="form-group">
      <label for="bio">Bio:</label>
      <textarea id="bio" name="bio" rows="4">{{ user.bio or '' }}</textarea>
    </div>

    <div class="form-group">
      <label for="profile_pic">Profile Picture:</label>
      <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
      {% if user.profile_pic %}
      <div class="current-pic">
        <p>Current profile picture:</p>
        <img src="{{ url_for('static', filename='profile_pics/' + user.profile_pic) }}" alt="Current profile picture">
      </div>
      {% endif %}
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('profile', username=user.username) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
